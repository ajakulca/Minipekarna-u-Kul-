<style>
  :root{
    --bg:#2e241d;
    --kraft:#e8dcc4;
    --kraft-dark:#d9c9a8;
    --cream:#f3ead9;
    --rust:#c1502e;
    --ink:#3a2e24;
    --gold:#c98a3e;
    --muted:#8a7a68;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);font-family:'Inter',sans-serif;color:var(--ink);padding-bottom:5rem;}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px;}
  header{padding-top:2rem;padding-bottom:.5rem;}
  .eyebrow{font-family:'Space Mono',monospace;color:var(--gold);letter-spacing:2px;font-size:.75rem;text-transform:uppercase;margin-bottom:.25rem;}
  h1{font-family:'Fraunces',serif;color:var(--cream);font-size:2rem;font-weight:600;font-style:italic;margin:0;}
  .headrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;}
  .logo{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);box-shadow:0 4px 12px rgba(0,0,0,.4);flex-shrink:0;}
  nav{display:flex;gap:2px;border-bottom:1px solid #4a3c2f;margin-top:1.5rem;flex-wrap:wrap;}
  nav button{font-family:'Fraunces',serif;font-size:1rem;background:none;border:none;color:var(--muted);padding:8px 10px;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;}
  nav button.active{color:var(--cream);border-color:var(--gold);}
  main{padding-top:1.5rem;}
  .btn-primary{width:100%;background:var(--rust);color:var(--cream);font-family:'Fraunces',serif;font-size:1.05rem;border:none;border-radius:12px;padding:14px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 16px rgba(0,0,0,.3);cursor:pointer;margin-bottom:1.5rem;}
  .card{background:var(--kraft);color:var(--ink);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 6px 16px rgba(0,0,0,.25);position:relative;}
  .card h3{font-family:'Fraunces',serif;font-size:1.3rem;font-weight:600;margin:0;}
  label{display:block;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.03em;opacity:.7;margin-bottom:4px;}
  input,select,textarea{width:100%;background:var(--cream);border:none;border-radius:8px;padding:9px 12px;font-family:inherit;font-size:.95rem;margin-bottom:12px;outline:none;color:var(--ink);}
  textarea{resize:none;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .formbtns{display:flex;gap:8px;margin-top:4px;}
  .btn-save{flex:1;background:var(--rust);color:var(--cream);border:none;border-radius:8px;padding:10px;font-weight:600;cursor:pointer;}
  .btn-cancel{background:none;border:1px solid var(--ink);color:var(--ink);border-radius:8px;padding:10px 16px;opacity:.7;cursor:pointer;}
  .del{position:absolute;top:14px;right:14px;background:none;border:none;opacity:.4;cursor:pointer;font-size:1rem;}
  .del:hover{opacity:.9;}
  .stagegrid{display:flex;gap:4px;margin-top:14px;}
  .stage{flex:1;border:none;border-radius:8px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;background:rgba(0,0,0,.06);color:var(--ink);}
  .stage.done{background:var(--rust);color:var(--cream);}
  .stage .icon{font-size:16px;}
  .stage .lbl{font-size:9px;line-height:1;text-align:center;}
  .done-badge{text-align:center;color:var(--rust);font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-top:10px;}
  .empty{text-align:center;color:var(--muted);font-style:italic;font-size:.9rem;padding:2.5rem 0;}
  .mono{font-family:'Space Mono',monospace;font-size:.75rem;opacity:.65;}
  .photos{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .photothumb{position:relative;width:64px;height:64px;}
  .photothumb img{width:100%;height:100%;object-fit:cover;border-radius:8px;}
  .photothumb button{position:absolute;top:-6px;right:-6px;background:var(--rust);color:var(--cream);border:none;border-radius:50%;width:20px;height:20px;font-size:11px;line-height:1;cursor:pointer;}
  .addphoto{width:64px;height:64px;border:1px dashed var(--ink);border-radius:8px;background:none;opacity:.6;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;}
  .cardtop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .iconbtn{background:none;border:none;opacity:.5;cursor:pointer;padding:4px;font-size:16px;}
  .iconbtn:hover{opacity:.9;}
  .breaddetail{margin-top:12px;padding-top:12px;border-top:1px solid var(--kraft-dark);}
  .breaddetail .grid2{display:grid;grid-template-columns:1fr 1fr;gap:2px;margin-bottom:8px;}
  .quote{font-style:italic;opacity:.75;font-size:.9rem;margin-top:6px;}
  .toast{background:#5a2a20;color:var(--cream);border-radius:8px;padding:10px 14px;font-size:.9rem;display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;}
  .toast button{background:none;border:none;color:var(--cream);cursor:pointer;font-size:1rem;}
  .reminder{background:#4a3319;border:1px solid var(--gold);color:var(--cream);border-radius:10px;padding:12px 14px;margin-bottom:1rem;font-size:.88rem;}
  .earnings{background:#2f4a33;border:1px solid #6fae7a;color:var(--cream);border-radius:10px;padding:10px 14px;margin-bottom:1rem;font-size:.9rem;}
  .earnings div{margin-bottom:2px;}
  .earnings div:last-child{margin-bottom:0;}
  .reminder .title{font-family:'Fraunces',serif;font-weight:600;margin-bottom:6px;color:var(--gold);}
  .reminder .item{margin-bottom:3px;}
  .ingredient-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .ingredient-row input{margin-bottom:0;}
  .ingredient-row input.iname{flex:2;}
  .ingredient-row input.igrams{flex:1;}
  .ingredient-row button{background:none;border:none;opacity:.5;font-size:1rem;cursor:pointer;padding:4px;}
  .add-ing-btn{background:none;border:1px dashed var(--ink);border-radius:8px;padding:6px 12px;font-size:.85rem;opacity:.7;cursor:pointer;margin-bottom:12px;}
  .doughweight{font-family:'Space Mono',monospace;font-size:.8rem;background:rgba(0,0,0,.06);border-radius:8px;padding:8px 10px;margin-bottom:12px;}
  .bellbtn{background:none;border:none;color:var(--gold);font-size:1.3rem;cursor:pointer;padding:4px;}
  .weightfield{margin-top:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .weightfield label{margin:0;white-space:nowrap;}
  .weightfield input{margin:0;width:90px;}
  .btn-save-weight{background:var(--rust);color:var(--cream);border:none;border-radius:8px;padding:9px 14px;font-size:.85rem;font-weight:600;cursor:pointer;}
  .saved-check{color:var(--rust);font-size:.85rem;font-weight:700;opacity:0;transition:opacity .3s;}
  .saved-check.show{opacity:1;}
</style>
</head>

<script>

function formatDate(d){
  if(!d) return "—";
  const date = new Date(d+"T00:00:00");
  return date.toLocaleDateString("cs-CZ", { weekday:"short", day:"numeric", month:"numeric" });
}

function resizeImage(file, maxWidth=480, quality=0.55){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxWidth/img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width*scale;
        canvas.height = img.height*scale;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function esc(s){
  return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

let showExport = false;

function render(){
  document.querySelectorAll("nav button").forEach(b=>{
    b.classList.toggle("active", b.dataset.tab === state.tab);
  });
  const app = document.getElementById("app");
  let html = "";
  if(state.error){
    html += `<div class="toast"><span>${esc(state.error)}</span><button data-action="dismiss-error">✕</button></div>`;
  }
  html += `<div style="margin-bottom:16px;">
    <button id="toggle-export-btn" class="mono" style="background:none;border:none;color:var(--gold);text-decoration:underline;padding:0;cursor:pointer;display:block;margin-bottom:6px;">${showExport ? "skrýt export dat" : "exportovat data (přesun na jiné zařízení)"}</button>
    <button id="toggle-import-btn" class="mono" style="background:none;border:none;color:var(--gold);text-decoration:underline;padding:0;cursor:pointer;display:block;">${showImport ? "skrýt import dat" : "importovat data (přesun z jiného zařízení)"}</button>
  </div>`;
  if(showExport){
    const exportJson = JSON.stringify({orders: state.orders, breads: state.breads, expenses: state.expenses});
    html += `<div class="card">
      <h3 style="margin-bottom:8px;">Export dat</h3>
      <div style="font-size:.85rem;margin-bottom:10px;opacity:.8;">Zkopíruj tenhle text (klepni do pole, samo se označí) a vlož ho do „Importovat data" ve druhé appce.</div>
      <textarea readonly id="export-textarea" rows="5" style="font-family:'Space Mono',monospace;font-size:11px;" onclick="this.select()">${esc(exportJson)}</textarea>
      <div class="formbtns">
        <button type="button" class="btn-save" id="copy-export-btn">Zkopírovat do schránky</button>
      </div>
    </div>`;
  }
  if(showImport){
    html += `<div class="card">
      <h3 style="margin-bottom:8px;">Import dat</h3>
      <div style="font-size:.85rem;margin-bottom:10px;opacity:.8;">Vlož sem text, který jsi zkopírovala z tlačítka „Exportovat data" ve druhé appce. Přepíše to všechno, co tu teď máš.</div>
      <textarea id="import-textarea" rows="5" style="font-family:'Space Mono',monospace;font-size:11px;" placeholder="{...}"></textarea>
      <div class="formbtns">
        <button type="button" class="btn-save" id="do-import-btn">Importovat</button>
        <button type="button" class="btn-cancel" id="cancel-import-btn">Zrušit</button>
      </div>
    </div>`;
  }
  html += renderEarningsBanner();
  html += renderReminderBanner();
  if(state.tab === "objednavky") html += renderOrdersTab();
  else if(state.tab === "chleby") html += renderBreadsTab();
  else if(state.tab === "dokoncene") html += renderCompletedTab();
  else html += renderExpensesTab();
  app.innerHTML = html;
  attachHandlers();
  maybeNotify();
}

function isAllDone(order){
  return STAGES.every(s => order.stages[s.key]);
}

function renderEarningsBanner(){
  const active = state.orders
    .filter(o => !isAllDone(o) && o.price != null)
    .reduce((sum,o)=> sum + o.price, 0);
  const received = state.orders
    .filter(o => isAllDone(o) && o.price != null)
    .reduce((sum,o)=> sum + o.price, 0);
  const spent = state.expenses.reduce((sum,e)=> sum + (e.price||0), 0);
  if(active === 0 && received === 0 && spent === 0) return "";
  const balance = received - spent;
  return `<div class="earnings">
    <div>📋 V aktivních objednávkách: <strong>${active} Kč</strong></div>
    <div>💰 Už přijato (dokončené): <strong>${received} Kč</strong></div>
    <div>🧾 Utraceno za suroviny: <strong>${spent} Kč</strong></div>
    <div>📊 Bilance (přijato − utraceno): <strong>${balance} Kč</strong></div>
  </div>`;
}

function daysUntil(dateStr){
  if(!dateStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(dateStr+"T00:00:00");
  return Math.round((target-today)/86400000);
}

function getUpcomingReminders(){
  return state.orders
    .filter(o => !o.stages.rozkvas && o.dateWanted)
    .map(o => ({ o, d: daysUntil(o.dateWanted) }))
    .filter(x => x.d !== null && x.d >= 0 && x.d <= 2)
    .sort((a,b)=>a.d-b.d);
}

function renderReminderBanner(){
  const items = getUpcomingReminders();
  if(items.length === 0) return "";
  const lines = items.map(({o,d})=>{
    const when = d===0 ? "dnes" : d===1 ? "zítra" : `za ${d} dny`;
    return `<div class="item">🔔 <strong>${esc(o.customer)}</strong> (${esc(o.breadName)}) – chce to ${when}, připrav rozkvas!</div>`;
  }).join("");
  return `<div class="reminder"><div class="title">Blíží se termín</div>${lines}</div>`;
}

function renderOrdersTab(){
  let html = "";
  if(!state.showOrderForm){
    html += `<button class="btn-primary" data-action="new-order">+ Nová objednávka</button>`;
  } else {
    html += orderFormHtml();
  }
  const sorted = [...state.orders]
    .filter(o => !isAllDone(o))
    .sort((a,b)=> (a.dateWanted||"9999").localeCompare(b.dateWanted||"9999"));
  if(sorted.length === 0 && !state.showOrderForm){
    html += `<div class="empty">Zatím žádné aktivní objednávky. Přidej první a začni si odškrtávat postup pečení.</div>`;
  }
  sorted.forEach(o => { html += orderCardHtml(o, false); });
  return html;
}

function renderCompletedTab(){
  let html = "";
  if(typeof state.showOrderForm === "string"){
    html += orderFormHtml();
  }
  const done = [...state.orders]
    .filter(o => isAllDone(o))
    .sort((a,b)=> (b.dateWanted||"").localeCompare(a.dateWanted||""));
  if(done.length === 0){
    html += `<div class="empty">Zatím žádné dokončené zakázky. Jakmile objednávku odškrtáš celou (i „Předáno"), objeví se tady.</div>`;
  }
  done.forEach(o => { html += orderCardHtml(o, true); });
  return html;
}

function renderExpensesTab(){
  let html = "";
  if(!state.showExpenseForm){
    html += `<button class="btn-primary" data-action="new-expense">+ Nový výdaj</button>`;
  } else {
    html += expenseFormHtml();
  }
  const sorted = [...state.expenses].sort((a,b)=> (b.date||"").localeCompare(a.date||""));
  const total = sorted.reduce((sum,e)=> sum + (e.price||0), 0);
  if(sorted.length > 0){
    html += `<div class="doughweight" style="margin-top:0;">celkem utraceno: <strong>${total} Kč</strong></div>`;
  }
  if(sorted.length === 0 && !state.showExpenseForm){
    html += `<div class="empty">Zatím žádné výdaje. Přidej nákup surovin — mouku, kvásek, semínka…</div>`;
  }
  sorted.forEach(e => { html += expenseCardHtml(e); });
  return html;
}

function orderCardHtml(order, archived){
  const doneCount = STAGES.filter(s=>order.stages[s.key]).length;
  const allDone = doneCount === STAGES.length;
  const stagesHtml = STAGES.map(s=>{
    const done = order.stages[s.key];
    return `<button type="button" class="stage ${done?"done":""}" data-order="${order.id}" data-stage="${s.key}">
      <span class="icon">${s.icon}</span><span class="lbl">${s.label}</span>
    </button>`;
  }).join("");
  const photos = order.photos || [];
  const photosHtml = photos.map((p,i)=>`
    <div class="photothumb"><img src="${p}"/>${archived ? "" : `<button type="button" data-action="rm-order-photo" data-order="${order.id}" data-idx="${i}">✕</button>`}</div>
  `).join("");
  const addPhotoBtn = (photos.length < 3)
    ? `<button type="button" class="addphoto" data-action="add-order-photo" data-order="${order.id}">📷</button>`
    : "";
  return `
  <div class="card">
    <button class="del" data-action="del-order" data-id="${order.id}">🗑</button>
    <button class="del" style="right:44px;" data-action="edit-order" data-id="${order.id}">✏️</button>
    <div class="cardtop">
      <div>
        <h3>${esc(order.customer)}</h3>
        <div class="mono" style="opacity:.7">${esc(order.breadName)}</div>
      </div>
      <div class="mono">${formatDate(order.dateWanted)}</div>
    </div>
    ${order.price!=null ? `<div class="mono" style="margin-top:2px;">cena: ${order.price} Kč</div>` : ""}
    ${order.note ? `<div class="quote">„${esc(order.note)}"</div>` : ""}
    <div class="stagegrid">${stagesHtml}</div>
    <div class="weightfield">
      <label style="margin:0;">Váha po upečení (g)</label>
      <input type="number" id="weight-input-${order.id}" data-order="${order.id}" value="${order.weightBaked!=null?order.weightBaked:""}" placeholder="—" />
      <button type="button" class="btn-save-weight" id="save-weight-btn-${order.id}" data-action="save-weight" data-order="${order.id}">Uložit</button>
    </div>
    <div class="photos" style="margin-top:12px;">${photosHtml}${addPhotoBtn}</div>
    <input type="file" accept="image/*" multiple hidden data-order-photo-input="${order.id}" />
    ${allDone ? `<div class="done-badge">Hotovo a předáno ✓</div>` : ""}
  </div>`;
}

function renderBreadsTab(){
  let html = "";
  if(!state.showBreadForm){
    html += `<button class="btn-primary" data-action="new-bread">+ Přidat chleba</button>`;
  } else {
    html += breadFormHtml();
  }
  if(state.breads.length === 0 && !state.showBreadForm){
    html += `<div class="empty">Zatím žádný chleba v seznamu. Přidej recept — poměr surovin, poznámky i fotky.</div>`;
  }
  state.breads.forEach(b => { html += breadCardHtml(b); });
  return html;
}

let tempPhotos = []; // fotky rozpracovaného formuláře chleba
let tempIngredients = []; // další suroviny rozpracovaného formuláře chleba (mimo mouku/vodu/kvásek/sůl)

function breadFormHtml(){
  const editing = typeof state.showBreadForm === "string" && state.showBreadForm !== "new"
    ? state.breads.find(b=>b.id===state.showBreadForm) : null;
  if(editing && tempPhotos._for !== editing.id){
    tempPhotos = [...(editing.photos||[])];
    tempPhotos._for = editing.id;
  }
  if(!editing && tempPhotos._for !== "new"){
    tempPhotos = [];
    tempPhotos._for = "new";
  }
  if(editing && tempIngredients._for !== editing.id){
    tempIngredients = editing.ingredients ? editing.ingredients.map(i=>({...i})) : [];
    tempIngredients._for = editing.id;
  }
  if(!editing && tempIngredients._for !== "new"){
    tempIngredients = [];
    tempIngredients._for = "new";
  }
  const photosHtml = tempPhotos.map((p,i)=>`
    <div class="photothumb"><img src="${p}"/><button type="button" data-action="rm-photo" data-idx="${i}">✕</button></div>
  `).join("");
  const addBtn = tempPhotos.length < 3 ? `<button type="button" class="addphoto" id="add-photo-btn">📷</button>` : "";

  const ingredientsHtml = tempIngredients.map((ing,i)=>`
    <div class="ingredient-row">
      <input class="iname" data-ing-idx="${i}" data-ing-field="name" placeholder="např. kmín" value="${esc(ing.name||"")}" />
      <input class="igrams" type="number" data-ing-idx="${i}" data-ing-field="grams" placeholder="g" value="${ing.grams!=null?ing.grams:""}" />
      <button type="button" data-action="rm-ingredient" data-idx="${i}">🗑</button>
    </div>
  `).join("");

  // živý přepočet celkové váhy těsta z aktuálních hodnot v poli (i před uložením)
  return `
  <form class="card" id="bread-form">
    <h3 style="margin-bottom:14px;">${editing ? "Upravit chleba" : "Nový chleba"}</h3>
    <label>Název</label>
    <input name="name" required placeholder="např. Žitnopšeničný se lněným semínkem" value="${editing?esc(editing.name):""}" />
    <div class="row2">
      <div><label>Mouka (g)</label><input type="number" name="mouka" id="f-mouka" value="${editing&&editing.mouka!=null?editing.mouka:""}"/></div>
      <div><label>Voda (g)</label><input type="number" name="voda" id="f-voda" value="${editing&&editing.voda!=null?editing.voda:""}"/></div>
      <div><label>Kvásek (g)</label><input type="number" name="kvasek" id="f-kvasek" value="${editing&&editing.kvasek!=null?editing.kvasek:""}"/></div>
      <div><label>Sůl (g)</label><input type="number" name="sul" id="f-sul" value="${editing&&editing.sul!=null?editing.sul:""}"/></div>
    </div>
    <label>Další suroviny (kmín, semínka, cibulka…)</label>
    <div id="ingredients-box">${ingredientsHtml}</div>
    <button type="button" class="add-ing-btn" id="add-ingredient-btn">+ přidat surovinu</button>
    <div class="doughweight" id="doughweight-box">váha těsta při zadělání: <strong>${computeInitialDoughWeight(editing)} g</strong></div>
    <label>Poznámka / postup</label>
    <textarea name="note" rows="2" placeholder="autolýza 30 min, kynutí 4h při 26°C…">${editing?esc(editing.note||""):""}</textarea>
    <label>Fotky (max 3)</label>
    <div class="photos" id="photos-box">${photosHtml}${addBtn}</div>
    <input type="file" id="photo-input" accept="image/*" multiple hidden />
    <div class="formbtns">
      <button type="submit" class="btn-save">Uložit</button>
      <button type="button" class="btn-cancel" data-action="cancel-bread">Zrušit</button>
    </div>
  </form>`;
}

function computeInitialDoughWeight(editing){
  const base = (editing?.mouka||0) + (editing?.voda||0) + (editing?.kvasek||0) + (editing?.sul||0);
  const extra = tempIngredients.reduce((sum,i)=> sum + (Number(i.grams)||0), 0);
  return base + extra;
}

function liveUpdateDoughWeight(){
  const g = id => Number(document.getElementById(id)?.value || 0);
  const base = g("f-mouka") + g("f-voda") + g("f-kvasek") + g("f-sul");
  let extra = 0;
  document.querySelectorAll('[data-ing-field="grams"]').forEach(inp => { extra += Number(inp.value || 0); });
  const box = document.getElementById("doughweight-box");
  if(box) box.innerHTML = `váha těsta při zadělání: <strong>${base+extra} g</strong>`;
}

function breadCardHtml(bread){
  const open = !!state.openBread[bread.id];
  const m = bread.mouka;
  const hyd = m ? Math.round((bread.voda/m)*100) : null;
  const kv = m ? Math.round((bread.kvasek/m)*100) : null;
  const sul = m ? Math.round((bread.sul/m)*1000)/10 : null;
  const statLine = [
    hyd ? `hydratace ${hyd}%` : "",
    kv ? `kvásek ${kv}%` : "",
    sul ? `sůl ${sul}%` : ""
  ].filter(Boolean).join(" · ");
  let detail = "";
  if(open){
    detail = `<div class="breaddetail">
      <div class="grid2 mono">
        ${bread.mouka?`<div>mouka: ${bread.mouka} g</div>`:""}
        ${bread.voda?`<div>voda: ${bread.voda} g</div>`:""}
        ${bread.kvasek?`<div>kvásek: ${bread.kvasek} g</div>`:""}
        ${bread.sul?`<div>sůl: ${bread.sul} g</div>`:""}
      </div>
      ${bread.ingredients&&bread.ingredients.length?`<div style="font-size:.9rem;margin-bottom:8px;"><span style="opacity:.6">další suroviny: </span>${bread.ingredients.map(i=>`${esc(i.name)}${i.grams?` (${i.grams} g)`:""}`).join(", ")}</div>`:""}
      ${bread.doughWeight?`<div class="mono" style="margin-bottom:8px;">váha těsta při zadělání: <strong>${bread.doughWeight} g</strong></div>`:""}
      ${bread.note?`<div class="quote" style="margin-bottom:10px;">${esc(bread.note)}</div>`:""}
      ${bread.photos&&bread.photos.length?`<div class="photos">${bread.photos.map(p=>`<img src="${p}" style="width:80px;height:80px;object-fit:cover;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.2);"/>`).join("")}</div>`:""}
    </div>`;
  }
  return `
  <div class="card">
    <div class="cardtop">
      <div style="flex:1">
        <h3>${esc(bread.name)}</h3>
        ${statLine?`<div class="mono" style="margin-top:4px;">${statLine}</div>`:""}
      </div>
      <div style="display:flex;gap:2px;">
        <button class="iconbtn" data-action="edit-bread" data-id="${bread.id}">✏️</button>
        <button class="iconbtn" data-action="del-bread" data-id="${bread.id}">🗑</button>
        <button class="iconbtn" data-action="toggle-bread" data-id="${bread.id}">${open?"▲":"▼"}</button>
      </div>
    </div>
    ${detail}
  </div>`;
}

// ---------- event handling ----------

function attachHandlers(){
  document.querySelectorAll('[data-action="dismiss-error"]').forEach(b=>{
    b.onclick = ()=>{ state.error=""; render(); };
  });

  const toggleExportBtn = document.getElementById("toggle-export-btn");
  if(toggleExportBtn) toggleExportBtn.onclick = ()=>{ showExport = !showExport; render(); };
  const copyExportBtn = document.getElementById("copy-export-btn");
  if(copyExportBtn) copyExportBtn.onclick = async ()=>{
    const ta = document.getElementById("export-textarea");
    try{
      await navigator.clipboard.writeText(ta.value);
      copyExportBtn.textContent = "Zkopírováno ✓";
      setTimeout(()=>{ copyExportBtn.textContent = "Zkopírovat do schránky"; }, 3000);
    }catch(e){
      ta.select();
    }
  };
  const toggleImportBtn = document.getElementById("toggle-import-btn");
  if(toggleImportBtn) toggleImportBtn.onclick = ()=>{ showImport = !showImport; render(); };
  const cancelImportBtn = document.getElementById("cancel-import-btn");
  if(cancelImportBtn) cancelImportBtn.onclick = ()=>{ showImport = false; render(); };
  const doImportBtn = document.getElementById("do-import-btn");
  if(doImportBtn) doImportBtn.onclick = ()=>{
    const raw = document.getElementById("import-textarea").value.trim();
    if(!raw) return;
    try{
      const parsed = JSON.parse(raw);
      if(!Array.isArray(parsed.orders) || !Array.isArray(parsed.breads)) throw new Error("bad shape");
      state.orders = parsed.orders;
      state.breads = parsed.breads;
      state.expenses = Array.isArray(parsed.expenses) ? parsed.expenses : state.expenses;
      saveOrders(); saveBreads(); saveExpenses();
      showImport = false;
      state.error = "";
      render();
      alert("Data byla úspěšně naimportována.");
    }catch(e){
      state.error = "Tenhle text se nepodařilo přečíst — zkontroluj, že jsi zkopírovala celý export.";
      render();
    }
  };

  // objednávky
  const newOrderBtn = document.querySelector('[data-action="new-order"]');
  if(newOrderBtn) newOrderBtn.onclick = ()=>{ state.showOrderForm=true; render(); };
  document.querySelectorAll('[data-action="edit-order"]').forEach(b=>{
    b.onclick = ()=>{ state.showOrderForm = b.dataset.id; render(); };
  });
  const cancelOrderBtn = document.querySelector('[data-action="cancel-order"]');
  if(cancelOrderBtn) cancelOrderBtn.onclick = ()=>{ state.showOrderForm=false; render(); };
  const orderForm = document.getElementById("order-form");
  if(orderForm) orderForm.onsubmit = (e)=>{
    e.preventDefault();
    const fd = new FormData(orderForm);
    const customer = (fd.get("customer")||"").trim();
    if(!customer) return;
    const breadId = fd.get("breadId") || null;
    const bread = state.breads.find(b=>b.id===breadId);
    if(typeof state.showOrderForm === "string"){
      const o = state.orders.find(o=>o.id===state.showOrderForm);
      if(o){
        o.customer = customer;
        o.breadId = breadId;
        o.breadName = bread ? bread.name : "Nezadaný druh";
        o.dateWanted = fd.get("dateWanted")||"";
        o.price = fd.get("price")===""?null:Number(fd.get("price"));
        o.note = (fd.get("note")||"").trim();
      }
    } else {
      const stages = {};
      STAGES.forEach(s=>stages[s.key]=false);
      state.orders.push({
        id: uid(),
        customer,
        breadId,
        breadName: bread ? bread.name : "Nezadaný druh",
        dateWanted: fd.get("dateWanted")||"",
        price: fd.get("price")===""?null:Number(fd.get("price")),
        note: (fd.get("note")||"").trim(),
        stages,
        photos: [],
        createdAt: Date.now()
      });
    }
    saveOrders();
    state.showOrderForm=false;
    render();
  };
  document.querySelectorAll('[data-action="del-order"]').forEach(b=>{
    b.onclick = ()=>{
      state.orders = state.orders.filter(o=>o.id!==b.dataset.id);
      saveOrders(); render();
    };
  });
  document.querySelectorAll(".stage").forEach(b=>{
    b.onclick = ()=>{
      const o = state.orders.find(o=>o.id===b.dataset.order);
      if(!o) return;
      o.stages[b.dataset.stage] = !o.stages[b.dataset.stage];
      saveOrders(); render();
    };
  });
  document.querySelectorAll('[data-action="save-weight"]').forEach(btn=>{
    btn.onclick = ()=>{
      const o = state.orders.find(o=>o.id===btn.dataset.order);
      if(!o) return;
      const input = document.getElementById("weight-input-"+o.id);
      o.weightBaked = input.value===""?null:Number(input.value);
      saveOrders();
      const b = document.getElementById("save-weight-btn-"+o.id);
      if(b){
        b.textContent = "Uloženo ✓";
        setTimeout(()=>{ b.textContent = "Uložit"; }, 4000);
      }
    };
  });
  document.querySelectorAll('[data-action="add-order-photo"]').forEach(b=>{
    b.onclick = ()=>{
      const input = document.querySelector(`[data-order-photo-input="${b.dataset.order}"]`);
      if(input) input.click();
    };
  });
  document.querySelectorAll('[data-order-photo-input]').forEach(input=>{
    input.onchange = async ()=>{
      const orderId = input.dataset.orderPhotoInput;
      const o = state.orders.find(o=>o.id===orderId);
      if(!o) return;
      if(!o.photos) o.photos = [];
      const files = Array.from(input.files||[]).slice(0, 3-o.photos.length);
      if(files.length===0) return;
      try{
        const results = await Promise.all(files.map(f=>resizeImage(f)));
        o.photos = [...o.photos, ...results].slice(0,3);
        saveOrders();
        render();
      }catch(err){
        console.error(err);
        state.error = "Fotku se nepodařilo zpracovat. Zkus to znovu, nebo zkus jinou fotku.";
        render();
      }
    };
  });
  document.querySelectorAll('[data-action="rm-order-photo"]').forEach(b=>{
    b.onclick = ()=>{
      const o = state.orders.find(o=>o.id===b.dataset.order);
      if(!o) return;
      o.photos = (o.photos||[]).filter((_,i)=>i!==Number(b.dataset.idx));
      saveOrders();
      render();
    };
  });

  // chleby
  const newBreadBtn = document.querySelector('[data-action="new-bread"]');
  if(newBreadBtn) newBreadBtn.onclick = ()=>{ state.showBreadForm="new"; render(); };
  const cancelBreadBtn = document.querySelector('[data-action="cancel-bread"]');
  if(cancelBreadBtn) cancelBreadBtn.onclick = ()=>{ state.showBreadForm=null; render(); };

  document.querySelectorAll('[data-action="edit-bread"]').forEach(b=>{
    b.onclick = ()=>{ state.showBreadForm = b.dataset.id; render(); };
  });
  document.querySelectorAll('[data-action="del-bread"]').forEach(b=>{
    b.onclick = ()=>{
      state.breads = state.breads.filter(x=>x.id!==b.dataset.id);
      saveBreads(); render();
    };
  });
  document.querySelectorAll('[data-action="toggle-bread"]').forEach(b=>{
    b.onclick = ()=>{
      state.openBread[b.dataset.id] = !state.openBread[b.dataset.id];
      render();
    };
  });

  const addIngBtn = document.getElementById("add-ingredient-btn");
  if(addIngBtn) addIngBtn.onclick = ()=>{
    tempIngredients.push({ name:"", grams:"" });
    render();
  };
  document.querySelectorAll('[data-action="rm-ingredient"]').forEach(b=>{
    b.onclick = ()=>{
      const forId = tempIngredients._for;
      tempIngredients = tempIngredients.filter((_,i)=>i!==Number(b.dataset.idx));
      tempIngredients._for = forId;
      render();
    };
  });
  document.querySelectorAll('[data-ing-field]').forEach(inp=>{
    inp.oninput = ()=>{
      const idx = Number(inp.dataset.ingIdx);
      const field = inp.dataset.ingField;
      if(tempIngredients[idx]) tempIngredients[idx][field] = field==="grams" ? inp.value : inp.value;
      liveUpdateDoughWeight();
    };
  });
  ["f-mouka","f-voda","f-kvasek","f-sul"].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.oninput = liveUpdateDoughWeight;
  });

  const photoInput = document.getElementById("photo-input");
  const addPhotoBtn = document.getElementById("add-photo-btn");
  if(addPhotoBtn) addPhotoBtn.onclick = ()=> photoInput.click();
  if(photoInput) photoInput.onchange = async (e)=>{
    const files = Array.from(e.target.files||[]).slice(0, 3-tempPhotos.length);
    if(files.length===0) return;
    try{
      const results = await Promise.all(files.map(f=>resizeImage(f)));
      tempPhotos = [...tempPhotos, ...results].slice(0,3);
      tempPhotos._for = state.showBreadForm === "new" ? "new" : state.showBreadForm;
      rerenderBreadFormOnly();
    }catch(err){ console.error(err); }
  };
  document.querySelectorAll('[data-action="rm-photo"]').forEach(b=>{
    b.onclick = ()=>{
      const idx = Number(b.dataset.idx);
      const forId = tempPhotos._for;
      tempPhotos = tempPhotos.filter((_,i)=>i!==idx);
      tempPhotos._for = forId;
      rerenderBreadFormOnly();
    };
  });

  const breadForm = document.getElementById("bread-form");
  if(breadForm) breadForm.onsubmit = (e)=>{
    e.preventDefault();
    const fd = new FormData(breadForm);
    const name = (fd.get("name")||"").trim();
    if(!name) return;
    const mouka = fd.get("mouka")===""?null:Number(fd.get("mouka"));
    const voda = fd.get("voda")===""?null:Number(fd.get("voda"));
    const kvasek = fd.get("kvasek")===""?null:Number(fd.get("kvasek"));
    const sul = fd.get("sul")===""?null:Number(fd.get("sul"));
    const ingredients = tempIngredients
      .filter(i => (i.name||"").trim() !== "")
      .map(i => ({ name: i.name.trim(), grams: i.grams===""||i.grams==null?null:Number(i.grams) }));
    const doughWeight = (mouka||0)+(voda||0)+(kvasek||0)+(sul||0)+ingredients.reduce((s,i)=>s+(i.grams||0),0);
    const data = {
      name, mouka, voda, kvasek, sul, ingredients, doughWeight,
      note: (fd.get("note")||"").trim(),
      photos: [...tempPhotos].filter(p=>typeof p==="string"),
    };
    if(state.showBreadForm==="new"){
      state.breads.push({ id: uid(), ...data, createdAt: Date.now() });
    } else {
      const b = state.breads.find(b=>b.id===state.showBreadForm);
      Object.assign(b, data);
    }
    saveBreads();
    state.showBreadForm=null;
    tempPhotos=[];
    tempIngredients=[];
    render();
  };

  const newExpenseBtn = document.querySelector('[data-action="new-expense"]');
  if(newExpenseBtn) newExpenseBtn.onclick = ()=>{ state.showExpenseForm=true; render(); };
  const cancelExpenseBtn = document.querySelector('[data-action="cancel-expense"]');
  if(cancelExpenseBtn) cancelExpenseBtn.onclick = ()=>{ state.showExpenseForm=false; render(); };
  document.querySelectorAll('[data-action="edit-expense"]').forEach(b=>{
    b.onclick = ()=>{ state.showExpenseForm = b.dataset.id; render(); };
  });
  document.querySelectorAll('[data-action="del-expense"]').forEach(b=>{
    b.onclick = ()=>{
      state.expenses = state.expenses.filter(e=>e.id!==b.dataset.id);
      saveExpenses(); render();
    };
  });
  const expenseForm = document.getElementById("expense-form");
  if(expenseForm) expenseForm.onsubmit = (e)=>{
    e.preventDefault();
    const fd = new FormData(expenseForm);
    const name = (fd.get("name")||"").trim();
    if(!name) return;
    const data = {
      name,
      price: fd.get("price")===""?null:Number(fd.get("price")),
      date: fd.get("date")||"",
    };
    if(typeof state.showExpenseForm === "string"){
      const ex = state.expenses.find(e=>e.id===state.showExpenseForm);
      if(ex) Object.assign(ex, data);
    } else {
      state.expenses.push({ id: uid(), ...data, createdAt: Date.now() });
    }
    saveExpenses();
    state.showExpenseForm=false;
    render();
  };
}

// re-render jen formuláře chleba (kvůli náhledu fotek), bez ztráty focusu na ostatních polích by šlo optimalizovat,
// pro jednoduchost přerendrujeme celou stránku
function rerenderBreadFormOnly(){
  render();
}

// ---------- upozornění v prohlížeči ----------

function maybeNotify(){
  if(!("Notification" in window)) return;
  if(Notification.permission !== "granted") return;
  const today = new Date().toISOString().slice(0,10);
  const notifiedKey = "pekarna-notified-" + today;
  if(localStorage.getItem(notifiedKey)) return; // dnes už jsme upozornili
  const items = getUpcomingReminders();
  if(items.length === 0) return;
  const body = items.map(({o,d})=>{
    const when = d===0 ? "dnes" : d===1 ? "zítra" : `za ${d} dny`;
    return `${o.customer} (${o.breadName}) – ${when}`;
  }).join("\n");
  new Notification("Připrav rozkvas 🔔", { body });
  localStorage.setItem(notifiedKey, "1");
}

const notifBtn = document.getElementById("notif-btn");
if(notifBtn){
  notifBtn.onclick = ()=>{
    if(!("Notification" in window)){
      alert("Tento prohlížeč upozornění nepodporuje.");
      return;
    }
    if(Notification.permission === "granted"){
      alert("Upozornění jsou už povolená. Appku stačí mít čas od času otevřenou, aby mohla zkontrolovat termíny.");
      maybeNotify();
    } else {
      Notification.requestPermission().then(perm=>{
        if(perm === "granted"){
          alert("Hotovo! Upozornění se ukážou, kdykoliv appku otevřeš a bude se blížit termín (2 dny dopředu).");
          maybeNotify();
        }
      });
    }
  };
}

// tabs
document.querySelectorAll("nav button").forEach(b=>{
  b.onclick = ()=>{
    state.tab = b.dataset.tab;
    state.showOrderForm=false;
    state.showBreadForm=null;
    state.showExpenseForm=false;
    render();
  };
});

render();
</script>
